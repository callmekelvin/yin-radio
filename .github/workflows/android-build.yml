name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  debug-build:
    name: Debug Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yin-radio-android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            yin-radio-android-app/**/*.gradle*
            yin-radio-android-app/**/gradle-wrapper.properties
            yin-radio-android-app/**/gradle.properties
            yin-radio-android-app/gradle/*.versions.toml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: yin-radio-android-app/app/build/outputs/apk/debug/*.apk

  release-build:
    name: Release Build
    needs: debug-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yin-radio-android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            yin-radio-android-app/**/*.gradle*
            yin-radio-android-app/**/gradle-wrapper.properties
            yin-radio-android-app/**/gradle.properties
            yin-radio-android-app/gradle/*.versions.toml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: yin-radio-android-app/app/build/outputs/apk/release/*.apk
